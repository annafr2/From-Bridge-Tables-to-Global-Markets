# EuroBridge Competition Registry
# Each entry defines one championship with all its tournament categories.
#
# Fields:
#   name:        Human-readable name (for file naming)
#   microsite:   Base URL of the competition's microsite (ends without trailing slash)
#   year:        Year of the competition
#   tournaments: Map of category name → qtournid (integer)
#   max_rounds:  How many rounds to attempt (we stop early if a round has no matches)
#   boards_per_round: Typical number of boards per match in this event

competitions:

